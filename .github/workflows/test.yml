name: Test
on:
  - push

jobs:
  test:
    name: test (${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2.7–3.1 have no builds for ubuntu-latest (26.04).
          - { version: '2.7', os: ubuntu-22.04 }
          - { version: '3.0', os: ubuntu-22.04 }
          - { version: '3.1', os: ubuntu-22.04 }
          - { version: '3.2', os: ubuntu-latest }
          - { version: '3.3', os: ubuntu-latest }
          - { version: '3.4', os: ubuntu-latest }
          - { version: '4.0', os: ubuntu-latest }
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.version }}

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Gems
        run: bundle install

      - name: Execute tests
        run: bundle exec rspec
